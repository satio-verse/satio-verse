<body style="font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.8;">
  <h1>文件整理</h1>
  <p>这个插件没有真实的世界视图，也没有「她看不见的真值」：它只按你显式给出的目录整理文件。</p>
  <p>本页是契约里 <code>plugin.world.spectate</code> 要求的旁观面板占位；<code>fixtures/twin.json</code>
     是同一个契约要求的双胞胎夹具占位。</p>
  <p>每次移动或撤销都会写一行回执（<code>~/.worldmodel/plugins/filesorter/receipts.jsonl</code>，可用
     <code>WM_FILESORTER_HOME</code> 改位置），凭回执编号可以撤销。</p>
</body>
</html>
