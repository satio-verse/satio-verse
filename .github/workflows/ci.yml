name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 语法检查（全量 compileall）
        run: python -m compileall -q wm tools tests
      - name: 核心测试（不依赖模型权重）
        run: python -m pytest -q tests/test_world_schema.py tests/test_world_economy.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 世界契约样例校验
        run: python -m pytest -q tests/test_plugin_manifest.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前端语法检查（ESM 按 .mjs 解析）
        run: |
          set -e
          for f in desktop/web/satio.js desktop/web/apartment-ayane.js desktop/web/apartment-edit.js desktop/web/shell.js; do
            [ -f "$f" ] || continue
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
            echo "ok $f"
          done
      - name: 页面不许引用外部资源（只查 src/href）
        run: |
          set -e
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          href_re = re.compile(r'(?:src|href)\s*=\s*["\'](https?://[^"\']+)', re.I)
          for p in list(pathlib.Path('desktop/web').glob('*.html')) + list(pathlib.Path('web').glob('*.html')):
              for i, line in enumerate(p.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  for m in href_re.finditer(line):
                      url = m.group(1)
                      if 'example.com' in url or 'github.com' in url:
                          continue
                      bad.append(f'{p}:{i}: {url}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('no external assets')
          PY
