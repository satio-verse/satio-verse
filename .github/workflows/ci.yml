name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查（全量 compileall）
        run: python -m compileall -q wm tools tests
      - name: 核心测试（不依赖模型权重）
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest -q tests/test_world_schema.py tests/test_world_economy.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 世界契约样例校验
        run: |
          pip install pytest
          python -m pytest -q tests/test_plugin_manifest.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前端语法检查（ESM 按 .mjs 解析）
        run: |
          for f in desktop/web/satio.js desktop/web/apartment-ayane.js desktop/web/apartment-edit.js desktop/web/shell.js; do
            [ -f "$f" ] || continue
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
          done
      - name: 零外链检查
        run: |
          ! grep -rn "https://" desktop/web/satio.html desktop/web/apartment-ayane.html 2>/dev/null
